plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Minecraft 26.2 requires Java 25.
def javaRelease = 25

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    // The optional dev bridge's group ONLY (see the bottom of this file). An unfiltered
    // mavenLocal() lets a stale locally-installed copy of any dependency shadow the real one,
    // which is a quiet way to build against the wrong thing.
    mavenLocal {
        content { includeGroup 'com.mattmc.mcptoolkit' }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaRelease)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaRelease
    it.options.encoding = 'UTF-8'
}

dependencies {
    // Minecraft 26.1+ ships unobfuscated: no `mappings` dependency at all, and no remapping, so
    // plain `implementation` rather than the old `modImplementation`.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // This mod genuinely needs Fabric API: DynamicRegistries (the decoration registry),
    // ResourceManagerHelper (the geometry loader) and LivingEntityRenderLayerRegistrationCallback
    // (the render layer) are all Fabric API.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// fabric.mod.json carries ${version}; expand it from the mod's own version.
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// ---------------------------------------------------------------------------
// Standalone pack zips.
//
// Every part this mod ships is data: data/ is a datapack, assets/ is a resource pack, and both are
// already inside the jar above. These zips are those same two trees on their own, for the "same
// ids, your pack" case - someone restyling a part's geometry or moving where it may be worn edits
// a copy of the pack instead of unzipping a jar. They are an addition to the jar and not a
// substitute for it: nothing renders without the Java.
//
// Zips, not jars, so they land in build/distributions/ rather than build/libs/.
// ---------------------------------------------------------------------------
def packDescription = "Armor Pieces ${project.version} - the mod's own content. Requires the mod."

// pack.mcmeta has to be generated rather than committed, because it carries the version. Wired as
// a task (not a doFirst on the Zip) so the format and description are declared inputs and the zip
// rebuilds when either changes.
//
// min_format/max_format rather than the familiar pack_format: past PackFormat.lastPreMinorVersion
// (64 for resources, 81 for data) the game REJECTS a bare pack_format - "Pack missing field, must
// declare both min_format and max_format" - and falls back to a metadata type that keeps only the
// description, which shows the pack up as incompatible. Both formats here are well past that.
// A bare int reads as .0 in min_format and as .MAX in max_format (PackFormat.BOTTOM_CODEC is
// fullCodec(0), TOP_CODEC is fullCodec(Integer.MAX_VALUE)), so major..major spans every minor of
// the one format the pack was built against.
def packMeta(String taskName, String format, String description) {
    tasks.register(taskName) {
        def mcmeta = layout.buildDirectory.file("packMeta/${taskName}/pack.mcmeta")
        inputs.property 'format', format
        inputs.property 'description', description
        outputs.file mcmeta
        doLast {
            def out = mcmeta.get().asFile
            out.parentFile.mkdirs()
            // Explicit UTF-8: Groovy's File.text would write the platform default, which on
            // Windows is not UTF-8 and quietly mangles anything non-ASCII in the description.
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(pack: [
                description: description,
                min_format: format as int,
                max_format: format as int,
            ])), 'UTF-8')
        }
    }
}

def datapackMeta = packMeta('datapackMeta', project.datapack_format, packDescription)
def resourcepackMeta = packMeta('resourcepackMeta', project.resourcepack_format, packDescription)

tasks.register('datapackZip', Zip) {
    group = 'build'
    description = "Bundles the mod's data/ tree as a standalone datapack."
    archiveBaseName = project.archives_base_name
    archiveClassifier = 'datapack'
    from datapackMeta
    from('src/main/resources/data') { into 'data' }
}

tasks.register('resourcepackZip', Zip) {
    group = 'build'
    description = "Bundles the mod's assets/ tree as a standalone resource pack."
    archiveBaseName = project.archives_base_name
    archiveClassifier = 'resourcepack'
    from resourcepackMeta
    from('src/main/resources/assets') { into 'assets' }
}

// So `./gradlew build` produces all three uploadable files, not just the jar.
tasks.named('assemble') {
    dependsOn 'datapackZip', 'resourcepackZip'
}

// ---------------------------------------------------------------------------
// The optional mcp-toolkit dev bridge.
//
// A local-only development tool: it is not published to any repository, so for anyone but its
// author it is simply absent, and an absent toolkit is a valid state - it means a plain vanilla
// dev run. Nothing in the mod compiles against it and nothing ships with it.
//
// Gradle has no "resolve only if present", so an optional dependency must be PROBED for before it
// is declared; otherwise an absent artifact fails resolution instead of degrading. Set
// `mcmod.toolkit=false` in gradle.properties to skip the probe entirely.
// ---------------------------------------------------------------------------
def toolkitVersion = project.findProperty('mcptoolkit_version') ?: '0.85.0'
def m2Root = file(System.getProperty('maven.repo.local')
    ?: "${System.getProperty('user.home')}/.m2/repository")
def toolkitJar = new File(m2Root,
    "com/mattmc/mcptoolkit/mcp-toolkit/${toolkitVersion}/mcp-toolkit-${toolkitVersion}.jar")
def wantsToolkit = (project.findProperty('mcmod.toolkit') ?: 'true').toString() != 'false'

if (wantsToolkit && toolkitJar.exists()) {
    dependencies {
        // `implementation`, not `compileOnly`: it also puts the bridge on the dev RUNTIME
        // classpath, which is how a dev run here gets a driveable game at all.
        implementation "com.mattmc.mcptoolkit:mcp-toolkit:${toolkitVersion}"
    }
    // configureEach rather than naming client/server, so a run configuration added later still
    // gets the flag.
    loom.runs.configureEach { run ->
        // The bridge's hotswap self-attaches a java agent to obtain Instrumentation; the JVM
        // refuses self-attach without this flag. It is the difference between editing a method
        // body and restarting the client to see the change.
        run.vmArg '-Djdk.attach.allowAttachSelf=true'
    }
}
