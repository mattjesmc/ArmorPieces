plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Minecraft 26.2 requires Java 25.
def javaRelease = 25

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    // The optional dev bridge's group ONLY (see the bottom of this file). An unfiltered
    // mavenLocal() lets a stale locally-installed copy of any dependency shadow the real one,
    // which is a quiet way to build against the wrong thing.
    mavenLocal {
        content { includeGroup 'com.mattmc.mcptoolkit' }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaRelease)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaRelease
    it.options.encoding = 'UTF-8'
}

dependencies {
    // Minecraft 26.1+ ships unobfuscated: no `mappings` dependency at all, and no remapping, so
    // plain `implementation` rather than the old `modImplementation`.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // The tests only. JUnit is a build-time dependency and ships in nothing.
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
    // Boots the tests inside Fabric, mixins applied. The codec tests need it: registering a dynamic
    // registry goes through a Fabric mixin into BuiltInRegistries, so the class that declares this
    // mod's registries cannot even initialise in a bare JVM.
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

    // This mod genuinely needs Fabric API: DynamicRegistries (the decoration registry),
    // ResourceManagerHelper (the geometry loader) and LivingEntityRenderLayerRegistrationCallback
    // (the render layer) are all Fabric API.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// One test, and it is the one the skin feature cannot do without: the mod bakes a skin in Java and
// tools/bake_skin.py bakes it in Python, and the two must agree texel for texel or a skin looks one
// way in Blockbench and another in game. SkinBakeTest holds the Java half to
// docs/plans/skin-bake-reference.json, which the Python half writes.
test {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full' }
}

// fabric.mod.json carries ${version}; expand it from the mod's own version.
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// The sources jar is a distributable in its own right, and the one that hands over every file the
// licence governs, so it carries the terms too - renamed like the jar's for the same reason.
tasks.named('sourcesJar') {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// ---------------------------------------------------------------------------
// Standalone pack zips.
//
// Every part this mod ships is data: data/ is a datapack, assets/ is a resource pack, and both are
// already inside the jar above. These zips are those same two trees on their own, for the "same
// ids, your pack" case - someone restyling a part's geometry or moving where it may be worn edits
// a copy of the pack instead of unzipping a jar. They are an addition to the jar and not a
// substitute for it: nothing renders without the Java.
//
// Zips, not jars, so they land in build/distributions/ rather than build/libs/.
// ---------------------------------------------------------------------------
def packDescription = "Armor Pieces ${project.version} - the mod's own content. Requires the mod."

// pack.mcmeta has to be generated rather than committed, because it carries the version. Wired as
// a task (not a doFirst on the Zip) so the format and description are declared inputs and the zip
// rebuilds when either changes.
//
// min_format/max_format rather than the familiar pack_format: past PackFormat.lastPreMinorVersion
// (64 for resources, 81 for data) the game REJECTS a bare pack_format - "Pack missing field, must
// declare both min_format and max_format" - and falls back to a metadata type that keeps only the
// description, which shows the pack up as incompatible. Both formats here are well past that.
// A bare int reads as .0 in min_format and as .MAX in max_format (PackFormat.BOTTOM_CODEC is
// fullCodec(0), TOP_CODEC is fullCodec(Integer.MAX_VALUE)), so major..major spans every minor of
// the one format the pack was built against.
def packMeta(String taskName, String format, String description) {
    tasks.register(taskName) {
        def mcmeta = layout.buildDirectory.file("packMeta/${taskName}/pack.mcmeta")
        inputs.property 'format', format
        inputs.property 'description', description
        outputs.file mcmeta
        doLast {
            def out = mcmeta.get().asFile
            out.parentFile.mkdirs()
            // Explicit UTF-8: Groovy's File.text would write the platform default, which on
            // Windows is not UTF-8 and quietly mangles anything non-ASCII in the description.
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(pack: [
                description: description,
                min_format: format as int,
                max_format: format as int,
            ])), 'UTF-8')
        }
    }
}

def datapackMeta = packMeta('datapackMeta', project.datapack_format, packDescription)
def resourcepackMeta = packMeta('resourcepackMeta', project.resourcepack_format, packDescription)

// LICENSE rides in each zip, at the root beside pack.mcmeta. These two are the easiest thing this
// project ships to re-host - a pack zip is already the shape a modpack wants, and unlike the jar it
// carries no metadata naming its terms - so they are the artifacts that most need the terms inside
// them. Not renamed the way the jar's copy is: that rename exists because jars get nested and
// merged and two LICENSE entries would collide, which cannot happen to a pack. The game ignores
// unknown files at a pack's root.
tasks.register('datapackZip', Zip) {
    group = 'build'
    description = "Bundles the mod's data/ tree as a standalone datapack."
    archiveBaseName = project.archives_base_name
    archiveClassifier = 'datapack'
    from datapackMeta
    from 'LICENSE'
    from('src/main/resources/data') { into 'data' }
}

tasks.register('resourcepackZip', Zip) {
    group = 'build'
    description = "Bundles the mod's assets/ tree as a standalone resource pack."
    archiveBaseName = project.archives_base_name
    archiveClassifier = 'resourcepack'
    from resourcepackMeta
    from 'LICENSE'
    from('src/main/resources/assets') { into 'assets' }
}

// So `./gradlew build` produces all three uploadable files, not just the jar.
tasks.named('assemble') {
    dependsOn 'datapackZip', 'resourcepackZip'
}

// ---------------------------------------------------------------------------
// The optional mcp-toolkit dev bridge.
//
// A local-only development tool: it is not published to any repository, so for anyone but its
// author it is simply absent, and an absent toolkit is a valid state - it means a plain vanilla
// dev run. Nothing in the mod compiles against it and nothing ships with it.
//
// Gradle has no "resolve only if present", so an optional dependency must be PROBED for before it
// is declared; otherwise an absent artifact fails resolution instead of degrading. Set
// `mcmod.toolkit=false` in gradle.properties to skip the probe entirely.
//
// The version below is ALSO the version `run/mcptoolkit/mcp-server` must be extracted from: the
// in-game bridge and the MCP shim that talks to it ship in one jar, and .mcp.json runs the shim out
// of that extract. Bump the two together, and `run/mcptoolkit/mcp-server/.extracted-version` says
// which one is on disk. 0.124.0 is the loop kit (mcp-toolkit LOOP_KIT_DESIGN.md): the image budget,
// `.mcptoolkit/loop.json` (a check on every reply, the project profile) and the batch painters,
// which is what this repo's own tools/mcp proxy no longer has to be. 0.124.0 in particular carries
// the five toolkit-side fixes this repo's falsifier run found (that document's section 11), so the
// extract below has to be the 0.124.0 one for any of them to be true here. 0.132.0 (2026-09-06) is
// the consumer's gate on top of it (mcp-toolkit RELEASE_1.md section K): `ping.build` (which jar is
// this game running, and is it stale), `get_tooltip`, `create_world` with datapacks at creation,
// `studio {entity, equipment, freeze}` and the tooltip-capable `click {hover}`; the extract is
// refreshed to it the same way.
//
// 0.133.0 replaced the THIRD-PARTY Blockbench MCP plugin with the toolkit's own
// (`mcp-toolkit/blockbench/mcptoolkit_bridge.js`, plain HTTP on 127.0.0.1:25801, session-bound
// projects, 26 argument-checked tools), which is why `tools/mcp/server.mjs` now speaks that
// transport and `.mcptoolkit/loop.json`'s keep-list names the new surface; 0.134.0 (2026-09-07)
// then deleted `render`'s refusal on a minimized window. 0.135.0 / shim 0.65.0 / plugin 0.2.0 is
// this repository's own measurement answered (docs/measurements/blockbench-plugins.md): a binding
// now lives exactly as long as its CONNECTION rather than a timer (`GET /presence`, which is why
// the extract has to move with the plugin - an old shim never opens presence and the plugin falls
// back to the timer), `PROJECT` is bound in `risky_eval`'s scope so a plugin API reached through an
// eval can address the right project instead of reading Blockbench's global, and a session id
// arriving from two connections is said on every reply. Both matter to a part session, so the
// extract is the 0.135.0 one.
//
// 0.136.0 / shim 0.66.0 (2026-09-07) is the identity everything above rests on, and the reason the
// extract has to move again (mcp-toolkit `docs/models/BLOCKBENCH_ISOLATION_DESIGN.md` section 6.1).
// The shim's session id used to fall back to its OWN process id, so this repo's two MCP servers -
// the toolkit shim and tools/mcp/server.mjs - presented two identities for one session, and every
// guard the plugin has is keyed on that id. `MCPTK_SESSION=armorpieces` in .mcp.json was hiding it
// by giving every session on the machine the SAME id, which disables those guards the other way.
// Both sides now compute `mcptk-${process.ppid}` - this session's own claude.exe, shared by its
// servers and by nothing else - and .mcp.json sets no session id at all. An extract older than
// 0.136.0 therefore re-splits the pair the moment that variable is gone, which it now is.
//
// 0.140.0 / shim 0.68.0 / Blockbench plugin 0.6.0 (2026-09-08) is A WINDOW EACH, and the reason the
// extract has to move a fourth time. 0.139.0 built step 2 of the isolation design: each Blockbench
// window's plugin takes the first FREE port at or above 25801 (sixteen wide) so the port names the
// window, `GET /hello` carries `{window, port, base_port, span, reserved, claimed_by}`, and a shim
// scans that range and REJOINS the window already holding its session id, else CLAIMS a free one,
// else ASKS an existing window for another (`POST /window` - a shim cannot make one; relaunching the
// exe forwards to the running instance and exits), else SHARES and says so on stderr. That is the
// answer to what this repo's own A/B measured (docs/measurements/CONCURRENCY_AB.md): the contended
// pair cost negative wall clock because a session has no binding until it has a piece, so the call
// that would give it one resolved against the active tab - which in one window belongs to whoever is
// working. 0.137.0 (`project op:new {bind:false}`) and 0.138.0 (the active-tab fallback no longer
// hands out a stranger's piece; closing one window no longer wipes every window's crash recovery)
// are the two smaller fixes underneath it, both found by that measurement.
//
// 0.140.0 itself is what a consumer needs on top: `risky_eval` injects `GAME` beside `PROJECT`, so
// the two older hand-loaded plugins (`mcptoolkitPush`, `mcptoolkitEntity`) take an explicit bridge
// and a project OBJECT instead of a hardcoded 25599 and a name - the hardcoded port named the
// TOOLKIT's own dev game from any consumer repo, and resolving by name bypassed the session binding
// outright. And it is the first version of the three that is PUBLISHED to mavenLocal: 0.137.0
// through 0.139.0 were committed in the toolkit and never published, so no consumer could resolve
// them whatever its build.gradle said, and a consumer arm run against a 0.139.0 label before
// 2026-09-08 would have measured the 0.136.0 shim. The consumer half of step 2 is in this
// repository: tools/mcp/server.mjs discovers over the same range instead of pinning 25801 - pinning
// it while the shim scanned would have undone the whole thing, by sending this session's piece work
// into the window another session had taken.
//
// 0.147.0 / shim 0.74.0 / Blockbench plugin 0.10.0 (2026-09-12) is the fifth move of the extract, and
// THIS REPOSITORY'S PIN IS NAMED IN IT AS THE CAUSE. 0.145.0 stopped the shim demanding a Blockbench
// window per idle session; on this machine that fix reached nothing, because the demanding shim is
// the copy a consumer repo pins - "ArmorPieces pins 0.140.0" - and a session that started days ago
// keeps the copy it started with. The symptom was eight windows open with no way to see or close
// them. So the pin below is not housekeeping: an old pin here is a defect over there, and the whole
// point of 0.141.0's bundling (shim version N beside plugin version N, one stamp) is undone by a
// consumer that does not move.
//
// What 0.147.0 adds on top of that: a CEILING on agent windows (`max_agent_windows`, 3) enforced in
// the plugin, counting the windows that have been ASKED for and do not exist yet - six got past a
// ceiling of three when several stale shims asked in the same second. An idle claim stops protecting
// an empty window: a claim now has its own clock, the last CALL by its holder, and past fifteen
// minutes it is released so the window is handed on and closes itself - the eight windows were all
// `connected: true`, held by terminals idle for days, and a socket being open says a process exists,
// not that anybody is working. The dock's interface moved to the START SCREEN because a Blockbench
// `Panel` measures 0x0 in a window with no project and the dock is designed never to have one, so
// its entire interface was unreachable in the only state it is ever in. One Tools entry instead of
// seven. And the dist manifest inside the jar finally says which shim it is: it had read `0.13.0`
// since the shim really was 0.13.0, sixty-one versions earlier, which matters precisely because a
// consumer runs an EXTRACTED COPY and what that copy says about itself is the only way anyone tells
// which code they have.
//
// 0.146.0 under it is the game speaking MCP on a door of its own - `POST http://127.0.0.1:<bridge port>/mcp`, served out of the jar with no Node and no
// extracted copy of anything, where the URL carries the surface (`/mcp` the configured default,
// `/mcp/observe` the reads) and a project declares its own in `config/mcptoolkit-surfaces.json`. That
// door is NOT the one this repository uses and is not meant to be: an MCP client spawns its servers
// when the CLIENT starts, which here is routinely with no game running, so .mcp.json keeps running
// the shim out of the extract below and the private /tools + /cmd API stays the supported path.
//
// Below it, the four versions that moved the Blockbench half, all of them continuing to answer this
// repository's own measurement (docs/measurements/CONCURRENCY_AB.md).
//
// 0.141.0 put the Blockbench
// plugins IN THE JAR: `mcptoolkit_bridge.js`, `_sync.js` and `_entity.js` used to exist only in the
// toolkit's working tree, so every install instruction here named a path no consumer could reach,
// and they now land inside the shim extract's own branch - `<gameDir>/mcptoolkit/blockbench/` every
// dev boot, `<repo>/.mcptoolkit/blockbench/` write-if-absent - under the shim's `.extracted-version`
// stamp and with no second stamp of their own. Shim version N beside plugin version N is the whole
// point, and it is why an extract left at 0.140.0 now pins an old plugin as well as an old shim.
// 0.142.0 made a window SOMEBODY'S: the default is inverted, so a window is a person's unless the
// plugin was asked to open it for an agent, an agent-born window closes itself once it has no live
// claim and no open projects, and `reserved` survives derived so an older shim still leaves a
// person's window alone. 0.144.0 answered six windows serving with nothing open in any of them and
// no death condition that could fire: the window stays the unit of OWNERSHIP and stops being the
// unit of GOVERNMENT, with one dock window owning the roster and arbitrating every close. 0.145.0 is
// the rule this repo will feel first - a window is taken when there is WORK, not when a session
// wakes up - and a manifest became a property of the plugin rather than of a window, so every window
// serves the same /tools.
//
// 0.143.0 is the one to read before trusting an old habit here: THE LAUNCHER LEFT. The whole
// `agent/claude/` package, the MMCP screens, the kits and `LaunchCommands` are archived, and three
// tools left the manifest - `companion_spawn`, `companion_stop`, `session_send`. Nothing in this
// repository calls them (checked at the bump) and nothing here drives the game by chat command, which
// is the other thing 0.141.0 would have broken: `/claude`, `/mcptk` and `/review` are one `/mmcp`
// tree now, deliberately WITHOUT aliases.
// ---------------------------------------------------------------------------
def toolkitVersion = project.findProperty('mcptoolkit_version') ?: '0.147.0'
def m2Root = file(System.getProperty('maven.repo.local')
    ?: "${System.getProperty('user.home')}/.m2/repository")
def toolkitJar = new File(m2Root,
    "com/mattmc/mcptoolkit/mcp-toolkit/${toolkitVersion}/mcp-toolkit-${toolkitVersion}.jar")
def wantsToolkit = (project.findProperty('mcmod.toolkit') ?: 'true').toString() != 'false'

if (wantsToolkit && toolkitJar.exists()) {
    dependencies {
        // `implementation`, not `compileOnly`: it also puts the bridge on the dev RUNTIME
        // classpath, which is how a dev run here gets a driveable game at all.
        implementation "com.mattmc.mcptoolkit:mcp-toolkit:${toolkitVersion}"
    }
    // configureEach rather than naming client/server, so a run configuration added later still
    // gets the flag.
    loom.runs.configureEach { run ->
        // The bridge's hotswap self-attaches a java agent to obtain Instrumentation; the JVM
        // refuses self-attach without this flag. It is the difference between editing a method
        // body and restarting the client to see the change.
        run.vmArg '-Djdk.attach.allowAttachSelf=true'
    }
}
