name: Armor Pieces
slug: armor-pieces
tagline: Decorative parts for armor — applied at a smithing table like trims, coloured by the same trim materials.
authors: [mattjes]
license: All Rights Reserved

assets:
  dir: docs/assets
  base_url: https://raw.githubusercontent.com/mattjesmc/ArmorPieces/main/

links:
  github: https://github.com/mattjesmc/ArmorPieces
  issues: https://github.com/mattjesmc/ArmorPieces/issues
  changelog: https://github.com/mattjesmc/ArmorPieces/blob/main/CHANGELOG.md
  # Not a header link - modpage uses this one only as the License badge's target.
  license: https://github.com/mattjesmc/ArmorPieces/blob/main/LICENSE

minecraft:
  versions: ["26.2"]
  loaders: [Fabric]
  environment: Client & Server

badges:
  style: for-the-badge
  color: 5b21b6
  show: [github, loaders, versions, license]

sections:
  about: |
    A vanilla trim is paint on the armor's texture, so it never sticks out. Armor Pieces adds
    **parts**: real geometry hung on the body. A plume on the helmet, spaulders on the shoulders, a
    sash on the belt, spurs on the heels.

    A part is applied at a smithing table the way a trim is, with a template and a trim material, and
    takes that material's colour. Trim and parts live on the same piece of armor; neither replaces the
    other.

    Some parts take a second material through a **fitting**: a gem set into the circlet, a metal
    buckle and a dyed strap on the sash, a dyed inlay on the greaves, a banner's design on the back banner. One more smithing
    step, with a template per fitting, and the item decides where it goes.

    Parts are crafted, or found: every one ships in a few of the world's chests. An **advanced
    smithing table** shows a whole set on a stand and takes a part off again, which the smithing
    table cannot.

    Twenty parts ship across twelve sockets. Each is a datapack entry, a model and a texture, no
    code, and a pack can add its own the same way - from Blockbench, in folders of its own.

  features:
    items:
      - title: Twelve sockets, one part at a time
        description: >-
          `crest`, `brow`, `horns`, `pauldrons`, `back`, `collar`, `vambraces`, `belt`, `tassets`,
          `knees`, `spurs`, `greaves`. A socket holds one part, so a new crest replaces the crest —
          but the twenty parts are spread unevenly over the twelve, three of them on `back` alone.
          Seven of the sockets are mirrored pairs, so spaulders means both shoulders.
      - title: Coloured by vanilla trim materials
        description: >-
          One grayscale master per part is mapped onto each material's own palette at load time.
          A new trim material costs a part no new art at all.
      - title: Fittings
        description: >-
          A part can declare places for a second material — `gemstone`, `guard`, `inlay`, `banner` —
          and a fitting template sets one: gems and metals by trim material, inlays by dye, banners
          from a banner made at a loom. There is a template per fitting, each with its own look and
          recipe, and the template with the third slot empty takes its fitting out again. Fittings
          are data too — a pack's new fitting gets its template from a recipe — and an effect can be
          gated on one.
      - title: Found in the world
        description: >-
          Every shipped part turns up in a few of the world's chests — wings in end cities, horns in
          bastions, the circlet in ancient cities — and a part names its own tables in its data file,
          which the mod adds it to as they load, the one thing a datapack cannot do for itself. A
          loot function puts a part on a piece of armor a table drops, gem and all.
      - title: Taking parts off
        description: >-
          The advanced smithing table, crafted from a smithing table, an armor stand and two iron
          ingots, holds a whole set worn by a stand at once, lists each piece's sockets, and empties
          one with a click — the one way a part ever comes off. Its own template and material slots
          run the smithing table's recipes, with the result on the stand before it is paid for.
      - title: One smithing recipe per socket, forever
        description: >-
          The part rides on the template item as a component, so a pack hands out a template and needs
          no recipe of its own. And any recipe the mod ships can be switched off by overriding its file
          with `{"type": "armorpieces:disabled"}` — a part that is found rather than made, a server
          without fittings.
      - title: Optional behaviour
        description: >-
          A part may carry effects — attributes, mob effects, a projectile dodge, gliding — configured
          in the same JSON file. `pinions` is a cut-down elytra that actually flies.
      - title: A Blockbench plugin for making parts
        description: >-
          Opens a part on the vanilla player wearing real armor, walk cycle and all. Master, static
          layer and fitting masks are painted in place, any trim material previews live with its
          fittings filled or empty, the name, sockets, fittings, effects and loot are a dialog, and
          Save writes every file the pack needs — into your own datapack and resource pack, which
          it makes, finds and zips for you.

  gallery:
    images:
      - src: gallery/sets.png
        caption: Every socket filled — three sets, one per row, in all eleven trim materials
      - src: gallery/row.png
        caption: The front row up close; the horns keep their ivory through every material
      - src: gallery/back.png
        caption: The same three rows from behind — wing roots, banner and pinions on the back socket
      - src: gallery/fittings.png
        caption: One circlet, seven gems — the fitting takes a second material

  recipes:
    columns: 3
    scale: 3
    summary: "Every recipe in the mod"
    # Shields, banners, the smithing table and the loom are rendered from a 3D model in game, so
    # they have no flat item texture to look up and drew as the missing-texture checkerboard; the
    # mod's own table is a block with the same problem. Stand-ins, from tools/gen_recipe_icons.py.
    # Paths are relative to assets.dir.
    icons:
      "minecraft:shield": icons/shield.png
      "minecraft:white_banner": icons/white_banner.png
      "minecraft:smithing_table": icons/smithing_table.png
      "minecraft:loom": icons/loom.png
      "armorpieces:advanced_smithing_table": icons/advanced_smithing_table.png
    custom_types:
      # The mod computes the decorated armor in code, so there is no `result`
      # in the JSON -- show the base armor as the outcome instead.
      "armorpieces:smithing_decoration":
        layout: smithing
        result: base
      "armorpieces:smithing_fitting":
        layout: smithing
        result: base

  dependencies:
    required:
      - name: Fabric API
        url: https://modrinth.com/mod/fabric-api
        note: Dynamic registries, resource reload, render layers

  incompatibilities:
    known: []

  installation: |
    1. Install [Fabric Loader](https://fabricmc.net/use/) 0.19.3+ on Minecraft 26.2 (Java 25).
    2. Drop this mod and Fabric API into `mods/`.
    3. Install it on both sides — the client draws the parts, the server owns their behaviour.

  faq:
    items:
      - q: Does a part replace the armor trim?
        a: No. A piece carries its trim and its parts at once.
      - q: How do I put a gem in the circlet?
        a: >-
          Craft a gemstone fitting template (an amethyst block in a ring of paper), then smithing
          table: template, the decorated helmet, and the gem. Every part on the piece is offered the
          item, so one gem fills the stone of each part that has one. The same template with the
          third slot empty takes the gem out again. A guard template does the same for metals, an
          inlay template for dyes, a banner template for banners. Re-applying a part at its own
          socket template keeps what is set in it, so changing a circlet's metal does not cost the
          gem.
      - q: How do I take a part off?
        a: >-
          At the advanced smithing table. Put the piece in one of its four slots, pick the socket
          in the list and click the cross. What was in the part's fittings goes with it.
      - q: Can two parts share a socket?
        a: >-
          No — applying a new crest replaces the crest. Several parts may be *available* for one socket
          (`horns` and `helm_wings` both fit `horns`); the choice is the expressive act.
      - q: Do I need the mod to add parts?
        a: >-
          You need the mod installed, but adding a part takes no Java — a datapack and a resource pack.
          Only a brand-new *effect* type needs code. The [authoring guide](https://github.com/mattjesmc/ArmorPieces/blob/main/docs/authoring.md) walks through it.

  # Without a body here modpage renders "Released under the **All Rights Reserved** license.",
  # which names the license without saying the one thing a reader of this section wants to know.
  license: |
    Released under a custom license — see
    [LICENSE](https://github.com/mattjesmc/ArmorPieces/blob/main/LICENSE).

    Use it, play with it, and modify it for yourself: no permission needed, no fee. **Redistribution
    needs written permission first.** That covers re-uploading the jar or the pack zips, mirroring
    them, and bundling the mod in a modpack, server pack or launcher — paid or not — as well as
    publishing a fork. Linking to an official download page never needs permission.

    Ask on the [issue tracker](https://github.com/mattjesmc/ArmorPieces/issues); permission is given
    in writing and covers the distribution it describes.

custom_sections:
  - id: adding-a-part
    title: Adding a part
    after: installation
    body: |
      A part is two files and a PNG, plus a line in your language file for the name — none of it
      code, and any namespace will do. Two ways to make them:

      - **In Blockbench**, with the [Armor Pieces plugin](https://github.com/mattjesmc/ArmorPieces/blob/main/tools/blockbench_plugin/armorpieces.js). It opens a part on the vanilla
        player wearing real armor, paints the textures in place, previews any trim material, and
        writes every file on Save.
      - **By hand**, writing the datapack entry, the geometry and the grayscale master yourself.

      The [authoring guide](https://github.com/mattjesmc/ArmorPieces/blob/main/docs/authoring.md) covers both, along with fittings, handing a part out, and giving
      it behaviour — attributes, mob effects, a dodge, gliding — from the same JSON file.

  - id: working-on-it
    title: Working on it
    after: adding-a-part
    body: |
      `./gradlew build`, `./gradlew runClient`, `./gradlew runServer`.

      | Where | What |
      | --- | --- |
      | `decoration/` | anchors, the datapack registry entry, the item component, the effect hooks |
      | `client/` | the render layer, the geometry loader and bake cache, the per-material palette |
      | `recipe/`, `item/`, `registry/`, `command/` | smithing, the twelve socket templates and the fitting template, the creative tab, `/armorpieces stage` |
      | `loot/`, `block/`, `menu/` | parts in loot tables and the `set_decoration` function; the advanced smithing table and its menu |
      | `tools/` | Blockbench rigs (`bb_rig.py`, with the vanilla figure and walk cycle from `mc_humanoid.py`), `.bbmodel` ↔ geometry (`bb_geo.py`), master and mask painting and install (`paint_<part>_master.py`, `fitting_mask.py`, `sync_decoration_masters.py`), a material and fitting preview outside the game (`preview_material.py`), template and recipe icons, `export_pack.py` for zipping a pack, `trace_geometry.py` for measuring a part against the body |
      | `tools/blockbench_plugin/` | the Blockbench plugin — see the [authoring guide](https://github.com/mattjesmc/ArmorPieces/blob/main/docs/authoring.md) |
      | `tools/decoration_masters/` | the grayscale masters — the source of truth for every part's art |

      The rigs, the `/armorpieces stage` command and the plugin's Save path are described in the
      [authoring guide](https://github.com/mattjesmc/ArmorPieces/blob/main/docs/authoring.md); `tools/check_authoring.py` runs the plugin's round trip over every
      shipped part.

footer: "Every part in this mod is the same two files and a PNG a pack of your own would write."
