  color: 5b21b6
  show: [github, loaders, versions, license]

# Every fact a page states about the mod's own contents, read out of the mod's own files by
# .modpage/generators/armorpieces.py. Nothing below counts anything, and nothing below writes a
# number down: `{from: counts}` and `{from: sockets}` are what the enum, the datapack folders and
# the language file say, at build time. `modpage generators` previews each.
generators:
  sockets:
    use: armorpieces.sockets
  pieces:
    use: armorpieces.pieces
  skins:
    use: armorpieces.skins
  cloths:
    use: armorpieces.cloths
  fittings:
    use: armorpieces.fittings
  loot_groups:
    use: armorpieces.loot_groups
  effect_types:
    use: armorpieces.effect_types
  counts:
    use: armorpieces.counts

sections:
  about: |
    You know the one. You walk into spawn in your best diamond and the first person you see is
    wearing the same helmet, the same chestplate, the same Sentry trim in the same netherite. Vanilla
    can build 1,568,239,201 armor sets, which sounds like plenty right up until it happens to you
    twice in a week.

    Armor Pieces takes that number to **3 × 10⁸⁴** — more than thirty thousand unique diamond sets
    for every atom in the observable universe. Diamond is one of seven armor materials.

    It gives one piece of armor **four layers of decoration, each an independent choice**:
    a **part** hung on a socket, a **skin** that changes what the plate itself is made of, a **cloth**
    worn over the chest, and vanilla's own **trim** underneath them all. Every one of them is applied
    at a smithing table, and none of them replaces another - a helmet can carry a skin, a trim, a
    crest, a browband and a pair of horns at once.

    **Pieces, over twelve sockets.** A plume on the helmet, spaulders on the shoulders, a sash on
    the belt, spurs on the heels - the table below is every socket and how many pieces it has to
    choose from. Pieces are real geometry hung on the body, not paint on the texture. A socket holds
    one piece, so the choice is the expressive act. Each is applied with a trim material and takes
    that material's colour.

    **Armor skins.** A skin is the armor's *own* texture - what the plate is, rather than what is
    bolted to it: plate, gothic, milanese, mail, lorica, runic, hoplite, samurai, gambeson and the
    rest. Each is recoloured through the armor material's own palette, so a skinned iron helmet
    still reads as iron and a modded armor material is skinned for free from the texture it already
    ships. A skin is paid for in the metal the piece is made of: re-skinning is re-forging.

    **Cloth.** A tunic or a tabard over a chestplate, carrying the design of any banner you make
    at a loom - so the heraldry is yours rather than a list the mod maintains. It is baked into the
    armor's texture rather than hung off it, so it clips nothing and the plate's own rivets and edges
    read through it.

    **Fittings.** Some parts have a second colour, set separately: a gem in the circlet, a metal
    buckle and a dyed strap on the sash, a dyed inlay on the greaves, a banner on the back banner.
    One more smithing step, one template per fitting, and the item decides where it goes.

    Most of it is **found rather than made**. A minority of pieces have a crafting recipe - the ones
    where the item is plainly the piece or what it is made of; the rest turn up in the chests that
    suit them, each theme in its own kind of structure, with the skins and the fitting templates
    alongside. An
    **advanced smithing table** shows a whole set worn by a stand and takes a part, a fitting, a
    trim, a skin or a cloth off again, which the smithing table cannot.

    Every part, skin and cloth is a datapack entry, a model and a texture, no code - and a pack adds
    its own the same way, from Blockbench, in folders of its own.

  features:
    items:
      - title: Twelve sockets, one part at a time
        description: >-
          `crest`, `brow`, `horns`, `pauldrons`, `back`, `collar`, `vambraces`, `belt`, `tassets`,
          `knees`, `spurs`, `greaves`. A socket holds one part, so a new crest replaces the crest —
          and every socket has several to choose from. Seven of the
          sockets are mirrored pairs, so spaulders means both shoulders.
      - title: Coloured by vanilla trim materials
        description: >-
          One grayscale master per part is mapped onto each material's own palette at load time.
          A new trim material costs a part no new art at all.
      - title: On your own hands, in first person
        description: >-
          Vanilla draws a bare sleeve on the first-person hand and nothing else — not armor, not a
          trim — so the one view you spend the whole game in is the one that never showed what you
          were wearing. Pauldrons and vambraces show there now, on the same player model the world
          sees, swinging with the arm through every animation the hand already has. They are close to
          the camera and they are meant to be — and there is a setting to turn them off, if you would
          rather keep the view clear.
      - title: Armor skins
        description: >-
          The one thing here that changes the armor itself rather than adding to it — plate, gothic,
          milanese, mail, chainmail, lorica, runic, hoplite, samurai, gambeson, brigandine,
          varangian, scale, lamellar. One greyscale master pair on vanilla's own armor grid,
          recoloured at load through eight shades taken from *that armor material's* vanilla
          texture, with vanilla's own panel edges and shadows mixed back over it. A skinned iron
          helmet still reads as iron, gold still reads as gold, and a modded armor material is
          skinned for free from the texture it already ships. Applied at the advanced smithing table
          with the piece's own reforging material — re-skinning is re-forging, and it costs the metal
          the piece is made of.
      - title: Cloth over the chest
        description: >-
          A **Tunic** or a **Tabard**, applied with a cloth template and a banner, and the design is
          the banner's — sixteen dyes crossed with every pattern layer, made at a loom, so the
          heraldry is a player's choice rather than a list the mod keeps. It is painted into the
          armor's own texture rather than hung off it, so it moves with the armor, clips nothing, and
          the plate's rivets and edges read *through* it. It sits over the skin, under every part and
          under the trim. One greyscale cut mask ships the whole feature; there is no per-material
          art and no per-banner art.
      - title: Fittings
        description: >-
          A part can declare places for a second material — `gemstone`, `guard`, `inlay`, `banner` —
          and a fitting template sets one: gems and metals by trim material, inlays by dye, banners
          from a banner made at a loom. There is a template per fitting, each with its own look and
          recipe, and the template with the third slot empty takes its fitting out again. Fittings
          are data too — a pack's new fitting gets its template from a recipe — and an effect can be
          gated on one.
      - title: Found in the world
        description: >-
          Most parts are found rather than crafted, each theme in the structures that suit it —
          knightly gear in strongholds and trial chambers, beast trophies in bastions, court
          jewellery in mansions and ancient cities, tidal parts in shipwrecks and ocean ruins. A
          **loot group** is one file naming a category of tables and the tag of parts found in
          them, so a pack adds a whole look to the world at once, or drops one part into one chest
          from its own data file — the one thing a datapack cannot do for itself, since it can only
          replace a vanilla table whole. Armor **skins** are found the same way, divided over the
          same groups, and a **fitting template** turns up in every one of them. The odds belong to
          the table, so a chest's chance of holding something stays put however many parts are
          added. A loot function puts a part on a piece of armor a table drops, gem and all.
      - title: Taking parts off
        description: >-
          The advanced smithing table, crafted from a smithing table, an armor stand and two iron
          ingots, holds a whole set worn by a stand at once and lists each piece's sockets and their
          fittings as rows of icons, with the piece's own row under them — its trim, its skin and, on
          a chestplate, its cloth. Pick one and Remove empties it — the one way a part, a fitting, a
          trim, a skin or a cloth ever comes off. An empty place shows a hint of the template that
          would fill it. Its own template and material slots run the
          smithing table's recipes, with the result on the stand before it is paid for, and a
          fitting goes into the socket that is picked rather than into every part that takes one.
      - title: One smithing recipe per socket, forever
        description: >-
          The part rides on the template item as a component, so a pack hands out a template and needs
          no recipe of its own. And any recipe the mod ships can be switched off by overriding its file
          with `{"type": "armorpieces:disabled"}` — a part that is found rather than made, a server
          without fittings.
      - title: Optional behaviour
        description: >-
          A part may carry effects — attributes, mob effects, a projectile dodge, gliding — configured
          in the same JSON file. `pinions` is a cut-down elytra that actually flies.
      - title: A Blockbench plugin for making parts
        description: >-
          Opens a part on the vanilla player wearing real armor, walk cycle and all. Master, static
          layer and fitting masks are painted in place, any trim material previews live with its
          fittings filled or empty, the name, sockets, fittings, effects and loot are a dialog, and
          Save writes every file the pack needs — into your own datapack and resource pack, which
          it makes, finds and zips for you.

