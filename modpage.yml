name: Armor Pieces
slug: armor-pieces
tagline: Parts, skins and cloth for armor — because someone else at spawn is wearing your diamond set.
authors: [mattjes]
license: All Rights Reserved

assets:
  dir: docs/assets
  base_url: https://raw.githubusercontent.com/mattjesmc/ArmorPieces/main/

links:
  github: https://github.com/mattjesmc/ArmorPieces
  issues: https://github.com/mattjesmc/ArmorPieces/issues
  changelog: https://github.com/mattjesmc/ArmorPieces/blob/main/CHANGELOG.md
  # Not a header link - modpage uses this one only as the License badge's target.
  license: https://github.com/mattjesmc/ArmorPieces/blob/main/LICENSE

minecraft:
  versions: ["26.2"]
  loaders: [Fabric]
  environment: Client & Server

badges:
