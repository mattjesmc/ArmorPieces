# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Environment. These are the versions the mod is built and tested against; build.gradle reads them
# straight from here, so a Minecraft bump is this block and nothing else.
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.159.0+26.2

# Pack formats for the standalone pack zips, read straight out of the game's own version.json for
# the minecraft_version above (pack_version.resource_major and pack_version.data_major). They move
# on their own schedule, so a Minecraft bump is still this block and nothing else.
resourcepack_format=88
datapack_format=107

# Mod
mod_version=0.1.2
maven_group=com.mattjesmc.armorpieces
archives_base_name=armorpieces
